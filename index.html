<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Accessible Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Personal Photo Gallery</h1>
    <p>Welcome to my custom photo gallery project showcasing responsive layout design and accessibility features.</p>
  </header>

  <main>
    <div class="grid">
      <figure>
        <img src="https://picsum.photos/id/1015/400/300" alt="A serene view of a blue mountain river at sunset">
        <figcaption>Explore beautiful mountain landscapes with fresh air and flowing rivers.</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1025/400/300" alt="A cute dog wrapped snugly in a warm blanket">
        <figcaption>Adoption programs bring joy and companionship into cozy homes every day.</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1039/400/300" alt="A waterfall plunging into a clear forest pool">
        <figcaption>Discovering hidden forest waterfalls provides quiet moments of solitude and reflection.</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1040/400/300" alt="A winding road through a dense green forest">
        <figcaption>Scenic road trips through ancient woodlands offer unforgettable outdoor adventures.</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1050/400/300" alt="Ocean waves crashing gently against rocky cliffs">
        <figcaption>Coastal breezes and dramatic cliffs present majestic views along the Pacific shore.</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1069/400/300" alt="A calm lake reflecting pine trees under a clear sky">
        <figcaption>Camping near peaceful waters creates memories that last throughout a lifetime.</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
