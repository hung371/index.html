<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<!-- Yêu cầu 8: Thêm sự kiện onload gọi hàm addTabFocus -->
<body onload="addTabFocus()">

    <main>
        <h1>Interactive Photo Gallery</h1>

        <!-- Khung hiển thị ảnh lớn & mô tả -->
        <div id="image">
            Hover over or tab to an image below to display here.
        </div>

        <!-- Yêu cầu 2 & 6: 6 hình ảnh với thẻ alt đầy đủ, giữ onmouseover/onmouseleave và thêm onfocus/onblur -->
        <div class="gallery">
            <img class="preview" 
                 alt="A beautiful path surrounded by autumn trees" 
                 src="https://picsum.photos/id/10/500/300" 
                 onmouseover="upDate(this)" 
                 onmouseleave="unDo()" 
                 onfocus="upDate(this)" 
                 onblur="unDo()">

            <img class="preview" 
                 alt="Serene mountain landscape at sunrise" 
                 src="https://picsum.photos/id/11/500/300" 
                 onmouseover="upDate(this)" 
                 onmouseleave="unDo()" 
                 onfocus="upDate(this)" 
                 onblur="unDo()">

            <img class="preview" 
                 alt="Calm blue ocean waves rolling onto the shore" 
                 src="https://picsum.photos/id/12/500/300" 
                 onmouseover="upDate(this)" 
                 onmouseleave="unDo()" 
                 onfocus="upDate(this)" 
                 onblur="unDo()">

            <img class="preview" 
                 alt="Lush green forest with sunlight beaming through leaves" 
                 src="https://picsum.photos/id/13/500/300" 
                 onmouseover="upDate(this)" 
                 onmouseleave="unDo()" 
                 onfocus="upDate(this)" 
                 onblur="unDo()">

            <img class="preview" 
                 alt="City skyline illuminated with vibrant night lights" 
                 src="https://picsum.photos/id/14/500/300" 
                 onmouseover="upDate(this)" 
                 onmouseleave="unDo()" 
                 onfocus="upDate(this)" 
                 onblur="unDo()">

            <img class="preview" 
                 alt="Snow-capped mountain peaks beneath a clear blue sky" 
                 src="https://picsum.photos/id/15/500/300" 
                 onmouseover="upDate(this)" 
                 onmouseleave="unDo()" 
                 onfocus="upDate(this)" 
                 onblur="unDo()">
        </div>
    </main>

</body>
</html>
